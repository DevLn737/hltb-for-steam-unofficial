name: Verify hosted HLTB access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Fetch and parse control games
        run: |
          python - <<'PY'
          import json
          from hltb_updater.client import HltbClient
          from hltb_updater.scheduler import check_canaries
          with HltbClient() as client:
              records = check_canaries(client, json.load(open('config/canaries.json'))['games'])
          for record in records:
              print(record.hltb_id, record.title, record.main_minutes)
          PY
