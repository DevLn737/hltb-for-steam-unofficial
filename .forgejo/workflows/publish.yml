name: Publish stable snapshot

on:
  schedule:
    - cron: '0 5 1 * *'
      timezone: Indian/Mauritius
  workflow_dispatch:
    inputs:
      version:
        description: Calendar snapshot version (YYYY.MM.DD.N)
        required: true
        type: string

jobs:
  publish:
    if: ${{ vars.ENABLE_STABLE_PUBLISH == 'true' }}
    runs-on: hltb-updater
    steps:
      - name: Check out private updater repository
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_SHA: ${{ forgejo.sha }}
        shell: bash
        run: |
          git init .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraHeader \
          GIT_CONFIG_VALUE_0="Authorization: token $FORGEJO_TOKEN" \
            git fetch --no-tags --depth=1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          git remote remove origin
      - name: Verify runner and network prerequisites
        run: scripts/preflight.sh
      - name: Install and test updater
        run: python3 -m pip install --disable-pip-version-check '.[test]'
      - run: pytest -q
      - name: Require a recently completed updater cycle
        run: hltb-updater check-publication --database /var/lib/hltb-updater/hltb.sqlite --max-age-hours 36
      - name: Derive scheduled version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-$(date -u +%Y.%m.%d.1)}"
          echo "value=$version" >> "$FORGEJO_OUTPUT"
      - name: Load previous stable manifest for delta gates
        id: previous
        shell: bash
        run: |
          mkdir -p previous
          if curl --fail --silent --show-error --location \
            https://devln737.github.io/hltb-for-steam-data/stable.json \
            --output previous/stable.json; then
            manifest_path="$(python3 -c 'import json; p=json.load(open("previous/stable.json", encoding="utf-8")); v=p["snapshotVersion"]; expected=f"versions/{v}/manifest.json"; assert p["manifestPath"] == expected; print(expected)')"
            version="$(python3 -c 'import json; print(json.load(open("previous/stable.json", encoding="utf-8"))["snapshotVersion"])')"
            mkdir -p "previous/versions/$version"
            curl --fail --silent --show-error --location \
              https://devln737.github.io/hltb-for-steam-data/stable.sig \
              --output previous/stable.sig
            curl --fail --silent --show-error --location \
              "https://devln737.github.io/hltb-for-steam-data/$manifest_path" \
              --output "previous/$manifest_path"
            curl --fail --silent --show-error --location \
              "https://devln737.github.io/hltb-for-steam-data/versions/$version/snapshot.pack" \
              --output "previous/versions/$version/snapshot.pack"
            hltb-updater verify-candidate --candidate previous --public-key config/snapshot-public-key.json
            echo "argument=--previous-manifest previous/$manifest_path" >> "$FORGEJO_OUTPUT"
          else
            baseline=/var/lib/hltb-updater/schema6-baseline-candidate.next/versions/2026.07.22.1/manifest.json
            if [ ! -f "$baseline" ]; then
              echo "The initial publication requires the verified July 2026 baseline at $baseline" >&2
              exit 1
            fi
            echo "argument=--previous-manifest $baseline" >> "$FORGEJO_OUTPUT"
          fi
      - name: Build signed candidate
        env:
          SNAPSHOT_SIGNING_KEY_B64: ${{ secrets.SNAPSHOT_SIGNING_KEY }}
        shell: bash
        run: |
          signing_dir="$(mktemp -d)"
          trap 'rm -rf "$signing_dir"' EXIT
          chmod 700 "$signing_dir"
          printf '%s' "$SNAPSHOT_SIGNING_KEY_B64" | base64 --decode > "$signing_dir/key.pem"
          rm -rf candidate
          hltb-updater build --database /var/lib/hltb-updater/hltb.sqlite --output candidate --version "${{ steps.version.outputs.value }}" --private-key "$signing_dir/key.pem" --overrides config/overrides.json ${{ steps.previous.outputs.argument }}
      - name: Verify complete signed candidate
        run: hltb-updater verify-candidate --candidate candidate --public-key config/snapshot-public-key.json
      - name: Publish GitHub Pages data branch
        env:
          DATA_REPOSITORY_URL: ${{ secrets.DATA_REPOSITORY_URL }}
          DATA_REPOSITORY_SSH_KEY: ${{ secrets.DATA_REPOSITORY_SSH_KEY }}
        shell: bash
        run: scripts/publish-pages.sh candidate
