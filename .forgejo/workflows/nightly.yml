name: Nightly updater

on:
  schedule:
    - cron: '30 3 * * *'
      timezone: Indian/Mauritius
  workflow_dispatch:
    inputs:
      maxTail:
        description: Maximum IDs beyond the current frontier
        default: 2000
        type: number
      maxRefresh:
        description: Maximum due records to refresh
        default: 1000
        type: number
      catchUpLimit:
        description: Maximum records from an active catch-up cohort
        default: 5000
        type: number
      catchUpCutoff:
        description: Initialize a catch-up cohort for records not successfully checked since this YYYY-MM-DD date
        required: false
        type: string
      buildOnly:
        description: Skip database updates and rebuild the shadow candidate only
        default: false
        type: boolean

jobs:
  update:
    runs-on: hltb-updater
    steps:
      - name: Check out private updater repository
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_SHA: ${{ forgejo.sha }}
        shell: bash
        run: |
          git init .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraHeader \
          GIT_CONFIG_VALUE_0="Authorization: token $FORGEJO_TOKEN" \
            git fetch --no-tags --depth=1 origin "$FORGEJO_SHA"
          git checkout --detach FETCH_HEAD
          git remote remove origin
      - name: Verify runner and network prerequisites
        run: scripts/preflight.sh
      - name: Install updater
        run: python3 -m pip install --disable-pip-version-check .
      - name: Rebalance legacy import schedule
        run: hltb-updater rebalance-schedule --database /var/lib/hltb-updater/hltb.sqlite
      - name: Verify parser canaries
        run: hltb-updater canary --database /var/lib/hltb-updater/hltb.sqlite --config config/canaries.json
      - name: Initialize requested catch-up cohort
        if: ${{ inputs.catchUpCutoff != '' }}
        run: >-
          hltb-updater catch-up-init
          --database /var/lib/hltb-updater/hltb.sqlite
          --cutoff ${{ inputs.catchUpCutoff }}
      - name: Update active catch-up or regular queues
        if: ${{ !inputs.buildOnly }}
        run: >-
          hltb-updater update-cycle
          --database /var/lib/hltb-updater/hltb.sqlite
          --max-tail ${{ inputs.maxTail || 2000 }}
          --max-refresh ${{ inputs.maxRefresh || 1000 }}
          --catch-up-limit ${{ inputs.catchUpLimit || 5000 }}
      - name: Create retained backup
        run: hltb-updater backup --database /var/lib/hltb-updater/hltb.sqlite --directory /var/lib/hltb-updater/backups
      - name: Build and verify shadow candidate
        env:
          SNAPSHOT_SIGNING_KEY_B64: ${{ secrets.SNAPSHOT_SIGNING_KEY }}
        shell: bash
        run: |
          signing_dir="$(mktemp -d)"
          trap 'rm -rf "$signing_dir"' EXIT
          chmod 700 "$signing_dir"
          printf '%s' "$SNAPSHOT_SIGNING_KEY_B64" | base64 --decode > "$signing_dir/key.pem"
          rm -rf /var/lib/hltb-updater/shadow-candidate.next
          previous=()
          if test -f /var/lib/hltb-updater/shadow-candidate/stable.json; then
            previous_path="$(python3 -c 'import json; print(json.load(open("/var/lib/hltb-updater/shadow-candidate/stable.json"))["manifestPath"])')"
            previous_manifest="/var/lib/hltb-updater/shadow-candidate/$previous_path"
            previous_schema="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["schema"])' "$previous_manifest")"
            if test "$previous_schema" = 5 || test "$previous_schema" = 6 || test "$previous_schema" = 7; then
              previous=(--previous-manifest "$previous_manifest")
            fi
          fi
          if test "${#previous[@]}" -eq 0; then
            baseline_database=/var/lib/hltb-updater/schema6-baseline-20260722.sqlite
            if ! test -f "$baseline_database"; then
              echo "Schema v6 baseline database is missing: $baseline_database" >&2
              exit 1
            fi
            rm -rf /var/lib/hltb-updater/schema6-baseline-candidate.next
            hltb-updater build \
              --database "$baseline_database" \
              --output /var/lib/hltb-updater/schema6-baseline-candidate.next \
              --version 2026.07.22.1 \
              --private-key "$signing_dir/key.pem" \
              --overrides config/overrides.json \
              --source-date 2026-07-22
            hltb-updater verify-candidate \
              --candidate /var/lib/hltb-updater/schema6-baseline-candidate.next \
              --public-key config/snapshot-public-key.json
            previous=(--previous-manifest /var/lib/hltb-updater/schema6-baseline-candidate.next/versions/2026.07.22.1/manifest.json)
          fi
          version="$(date -u +%Y.%m.%d.1)"
          hltb-updater build \
            --database /var/lib/hltb-updater/hltb.sqlite \
            --output /var/lib/hltb-updater/shadow-candidate.next \
            --version "$version" \
            --private-key "$signing_dir/key.pem" \
            --overrides config/overrides.json \
            "${previous[@]}"
          hltb-updater verify-candidate \
            --candidate /var/lib/hltb-updater/shadow-candidate.next \
            --public-key config/snapshot-public-key.json
          rm -rf /var/lib/hltb-updater/shadow-candidate.previous
          if test -d /var/lib/hltb-updater/shadow-candidate; then
            mv /var/lib/hltb-updater/shadow-candidate /var/lib/hltb-updater/shadow-candidate.previous
          fi
          mv /var/lib/hltb-updater/shadow-candidate.next /var/lib/hltb-updater/shadow-candidate
